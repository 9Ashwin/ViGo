[package]
name = "vigo"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "A native macOS action wheel"

[[bin]]
name = "ViGo"
path = "src-native/main.rs"

[features]
diagnostics = []

[dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
