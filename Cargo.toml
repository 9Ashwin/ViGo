[package]
name = "vigo"
version = "0.5.2"
edition = "2021"
license = "MIT"
description = "A native macOS action wheel"

[[bin]]
name = "ViGo"
path = "src-native/main.rs"

[features]
diagnostics = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
